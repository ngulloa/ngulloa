<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Avatar genérico</title>
<desc id="desc">Recurso visual genérico para una plantilla web.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#11191b"/>
    <stop offset="100%" stop-color="#1c272a"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity="0.28"/>
  </filter>
</defs>
<rect width="512" height="512" rx="28" fill="url(#bg)"/>

<defs>
  <radialGradient id="halo" cx="50%" cy="35%" r="65%">
    <stop offset="0%" stop-color="#8be8d7" stop-opacity=".42"/>
    <stop offset="55%" stop-color="#6ccfbe" stop-opacity=".16"/>
    <stop offset="100%" stop-color="#7456e8" stop-opacity=".06"/>
  </radialGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#66e2cc"/>
    <stop offset="50%" stop-color="#5da9ff"/>
    <stop offset="100%" stop-color="#a675ff"/>
  </linearGradient>
</defs>
<circle cx="256" cy="256" r="205" fill="url(#halo)"/>
<circle cx="256" cy="256" r="174" fill="#162124" stroke="url(#ring)" stroke-width="10" filter="url(#shadow)"/>
<circle cx="256" cy="210" r="72" fill="#dce9e6"/>
<path d="M126 399c18-74 69-111 130-111s112 37 130 111" fill="#dce9e6"/>
<circle cx="410" cy="116" r="18" fill="#ff7f6d"/>
<circle cx="96" cy="160" r="12" fill="#67d7ff"/>
<circle cx="398" cy="378" r="14" fill="#aa7cff"/>

</svg>